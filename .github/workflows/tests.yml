name: Fixture tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository_owner == 'Biblejustin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify environment and run isolated fixture tests
        run: make PY=python test
      - name: Record installed package versions in job log
        run: python -m pip freeze
